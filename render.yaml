services:
  - type: web
    name: weeklyflow
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: MENTOR_NAME
        sync: false
      - key: MENTOR_EMAIL
        sync: false
      - key: MENTOR_PASSWORD
        sync: false
      - key: STUDENT_NAME
        value: Vaishu
      - key: STUDENT_EMAIL
        sync: false
      - key: STUDENT_PASSWORD
        sync: false
